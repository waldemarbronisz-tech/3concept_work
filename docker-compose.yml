# Lokalna baza do developmentu (decyzja D1). Start: `npm run db:up`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: 3concept-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: c3work
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tworzy drugą bazę `c3work_test` dla testów (tylko przy pierwszym starcie wolumenu).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d c3work"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
